build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-5.0
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: |
    export HOME=/tmp
    export GOFLAGS=-mod=readonly
    make lint
  container:
    from: src
- as: unit
  commands: |
    export HOME=/tmp
    export GOFLAGS=-mod=readonly
    make test
  container:
    from: src
- as: verify-tekton-bundles
  run_if_changed: ^(\.tekton/|Makefile$)
  steps:
    test:
    - ref: hyperfleet-verify-tekton-bundles
zz_generated_metadata:
  branch: main
  org: openshift-hyperfleet
  repo: hyperfleet-applier
